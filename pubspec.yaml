name: haftnard
description: "HaftNard — roguelike Persian backgammon with the Double Seven."
publish_to: 'none'
version: 1.1.0+11

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  meta: ^1.19.0
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.31.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
  shaders:
    - shaders/nebula.frag
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
    - family: Cinzel
      fonts:
        - asset: assets/fonts/CinzelDecorative-Bold.ttf
          weight: 700
