name: CI

on:
  push:
    branches: [main, claude/vibrant-newton-gzwmx2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test --coverage
      - name: Balance simulator smoke run
        run: dart run tool/simulate.dart --games 24 --quiet --out build/balance-smoke.md
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build APK & AAB
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Signing: repository secrets if present, otherwise the committed CI
      # keystore (android/ci/haftnard-ci.jks) so every build installs over the
      # previous one. See docs/RELEASE.md.
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "Using the committed CI keystore."
            printf 'storeFile=../ci/haftnard-ci.jks\nstorePassword=haftnard-ci\nkeyAlias=haftnard\nkeyPassword=haftnard-ci\n' \
              > android/key.properties
          fi

      - name: Build APKs (per ABI)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols && break
            echo "Retrying in 20s ($i)"; sleep 20
          done
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/haftnard-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/haftnard-armv7.apk
      - name: Build APK (universal)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --obfuscate --split-debug-info=build/symbols && break
            echo "Retrying in 20s ($i)"; sleep 20
          done
          test -f build/app/outputs/flutter-apk/app-release.apk
      - name: Build AAB
        run: |
          for i in 1 2 3; do
            flutter build appbundle --release --obfuscate --split-debug-info=build/symbols && break
            echo "Retrying in 20s ($i)"; sleep 20
          done
      - name: Collect outputs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dist/haftnard-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/haftnard.aab
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: haftnard-android
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: haftnard-symbols
          path: build/symbols/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build-android
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize releases so two pushes never pick the same tag.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: haftnard-android
          path: dist
      - name: Compute tag and notes
        id: meta
        run: |
          set -e
          git fetch --tags --force
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          # Skip if this exact commit is already released (e.g. main and the
          # work branch point at the same commit).
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit already released as $(git tag --points-at HEAD | head -1)"
            exit 0
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="v$version-build.${GITHUB_RUN_NUMBER}"
            n=1
            while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
              tag="v$version-build.${GITHUB_RUN_NUMBER}.$n"; n=$((n+1))
            done
          fi
          prev=$(git tag --list 'v*' --sort=-creatordate | head -1)
          # Hand-written notes for a version win over the commit list.
          written="docs/release_notes/v$version.md"
          {
            echo "## HaftNard $tag"
            echo
            if [ -f "$written" ]; then
              cat "$written"
            else
              echo "Download **haftnard-arm64.apk** for most phones (or haftnard-universal.apk)."
              echo
              echo "### Changes"
              if [ -n "$prev" ]; then
                git log "$prev..HEAD" --no-merges --pretty='- %s' | head -40
              else
                git log --no-merges --pretty='- %s' | head -40
              fi
            fi
          } > notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (previous: ${prev:-none})"
      - name: Publish GitHub Release
        if: steps.meta.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HaftNard ${{ steps.meta.outputs.tag }}
          body_path: notes.md
          make_latest: "true"
          files: |
            dist/haftnard-arm64.apk
            dist/haftnard-armv7.apk
            dist/haftnard-universal.apk
            dist/haftnard.aab
